<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DigitalOcean Design Lab</title>
  </head>
  <body>
    <!-- Walrus icon sprite (hidden, used by Icon component via <use xlink:href>) -->
    <div id="walrus-icons" style="display:none"></div>
    <script>
      fetch('/walrus-icons.svg')
        .then(r => r.text())
        .then(svg => { document.getElementById('walrus-icons').innerHTML = svg; });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
